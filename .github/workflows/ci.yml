name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci  # pragma: allowlist secret (Postgres desechable del CI)
          POSTGRES_DB: cuadro_mandos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://ci:ci@localhost:5432/cuadro_mandos  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependencias
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Migraciones pendientes
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests (sin servicios externos)
        run: uv run pytest -m "not externo"
