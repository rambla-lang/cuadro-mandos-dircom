{% extends "base.html" %}
{% block titulo %}Acceso · Cuadro de mandos DIRCOM{% endblock %}
{% block contenido %}
<h1>Acceso</h1>
{% if form.errors %}<p class="error" role="alert">Email o contraseña incorrectos.</p>{% endif %}
<form method="post">
  {% csrf_token %}
  <label for="id_username">Email</label>
  <input type="email" name="username" id="id_username" autocomplete="email" required autofocus>
  <label for="id_password">Contraseña</label>
  <input type="password" name="password" id="id_password" autocomplete="current-password" required>
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Entrar</button>
</form>
{% endblock %}
